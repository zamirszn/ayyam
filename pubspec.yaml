name: ayyam
description: A calm, private companion for dua and prayer reflection.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  android_intent_plus: ^6.1.0
  crypto: ^3.0.8
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.3
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  flutter_timezone: ^5.1.1
  http: ^1.6.0
  motor: ^1.1.0
  shared_preferences: ^2.5.6
  share_plus: ^13.3.1
  timezone: ^0.11.2
  url_launcher: ^6.3.3
  workmanager: ^0.10.10

dev_dependencies:
  build_runner: ^2.17.1
  drift_dev: ^2.35.2
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  fonts:
    - family: InstrumentSans
      fonts:
        - asset: assets/fonts/instrument_sans/InstrumentSans-Variable.ttf
    - family: SpaceMono
      fonts:
        - asset: assets/fonts/space_mono/SpaceMono-Regular.ttf
