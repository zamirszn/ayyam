name: ayyam
description: A calm, private companion for dua and prayer reflection.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  http: ^1.6.0
  motor: ^1.1.0
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  fonts:
    - family: InstrumentSans
      fonts:
        - asset: assets/fonts/instrument_sans/InstrumentSans-Variable.ttf
    - family: SpaceMono
      fonts:
        - asset: assets/fonts/space_mono/SpaceMono-Regular.ttf
